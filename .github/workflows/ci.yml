name: Go

on:
  push:
    branches: [ master, actions ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.16

      - name: vet
        run: go vet

      - name: Test
        run: go test -v ./...
