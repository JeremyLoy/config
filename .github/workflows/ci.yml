name: Go

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:

  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the minimum version declared in go.mod
          - name: minimum
            go-version-file: go.mod
          - name: stable
            go-version: stable
    name: ci (${{ matrix.name }})
    env:
      GOTOOLCHAIN: local # test the installed Go, never an auto-downloaded one
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}

      # staticcheck v0.8.1 pins a golang.org/x/tools that cannot read Go 1.27.2's
      # export data ("export data version 5 is greater than maximum supported version 4").
      # Build it against the latest x/tools until a staticcheck release does so itself.
      - name: install staticcheck
        run: |
          cd "$(mktemp -d)"
          go mod init tools
          go get honnef.co/go/tools/cmd/staticcheck@latest golang.org/x/tools@latest
          go build -o "$(go env GOPATH)/bin/staticcheck" honnef.co/go/tools/cmd/staticcheck

      - name: static analysis
        run: |
          test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
          go vet ./...
          staticcheck ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.name == 'stable'
        run: go run github.com/mattn/goveralls@latest -coverprofile=coverage.out -service=github
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
